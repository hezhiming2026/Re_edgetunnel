services:
  optimizer:
    build:
      context: ../..
      dockerfile: deploy/nas/optimizer.Dockerfile
    image: re-edgetunnel-optimizer:local
    restart: unless-stopped
    init: true
    env_file:
      - ./optimizer.env
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - ./optimizer-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
