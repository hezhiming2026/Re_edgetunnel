name: Stage A Canary Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-a-canary-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mark canary pending
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'stage-a/canary',
              description: 'Running redacted Stage A canary',
              target_url: runUrl
            });

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Resolve production base URL without duplicating hostname configuration
        shell: bash
        run: |
          set -euo pipefail
          EDGE_HOST="$(awk -F '"' '/^HOST = / {print $2; exit}' wrangler.toml)"
          if [[ -z "$EDGE_HOST" ]]; then
            echo '::error::Unable to resolve HOST from wrangler.toml.'
            exit 1
          fi
          echo "EDGE_BASE_URL=https://${EDGE_HOST}" >> "$GITHUB_ENV"

      - name: Run non-mutating Stage A canary
        env:
          OPTIMIZER_TOKEN: ${{ secrets.EDGETUNNEL_OPTIMIZER_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.EDGETUNNEL_ADMIN }}
          DIAGNOSTIC_TARGETS: ${{ secrets.EDGETUNNEL_DIAGNOSTIC_TARGETS }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-canary.mjs | tee /tmp/stage-a-canary.log

      - name: Publish redacted canary result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const success = '${{ job.status }}' === 'success';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            if (fs.existsSync('/tmp/stage-a-canary.log')) {
              const lines = fs.readFileSync('/tmp/stage-a-canary.log', 'utf8').split(/\r?\n/).filter(Boolean);
              for (const line of lines) {
                let item;
                try { item = JSON.parse(line); } catch { continue; }
                if (item?.canary !== 'egress' || typeof item.target !== 'string') continue;
                const key = item.target.replace(/[^A-Za-z0-9._-]/g, '_').slice(0, 40) || 'target';
                const direct = item?.direct?.state === 'ok' ? 'ok' : 'error';
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  state: 'success',
                  context: `stage-a/diagnostic/${key}/${direct}`,
                  description: 'Redacted direct-path measurement recorded',
                  target_url: runUrl
                });
              }
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'stage-a/canary',
              description: success ? 'Stage A canary passed' : 'Stage A canary failed',
              target_url: runUrl
            });
