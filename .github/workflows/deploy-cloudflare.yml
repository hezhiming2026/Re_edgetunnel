name: Validate and Deploy Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check

  deploy:
    name: Deploy edge.tianbufu.click
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'deploy/') &&
       contains(github.event.pull_request.title, '[deploy-production]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-cloudflare-production
      cancel-in-progress: false

    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'cloudflare/production',
              description: 'Deploying edge.tianbufu.click'
            });

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Provision production KV and prepare Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_TITLE: tianbufu-edge-production
        run: bash scripts/prepare-cloudflare-config.sh

      - name: Deploy Worker and upload runtime secrets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.deploy.toml
          secrets: |
            ADMIN
            UUID
        env:
          ADMIN: ${{ secrets.EDGETUNNEL_ADMIN }}
          UUID: ${{ secrets.EDGETUNNEL_UUID }}

      - name: Configure hostname Security Level override
        id: security
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: tianbufu.click
          EDGE_HOSTNAME: edge.tianbufu.click
        run: bash scripts/configure-edge-security.sh

      - name: Probe custom domain from GitHub-hosted runner
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -u
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          for attempt in {1..2}; do
            code="$(curl --silent --show-error --max-time 15 \
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              https://edge.tianbufu.click/ || true)"

            if [[ "$code" == "200" ]]; then
              echo "edge.tianbufu.click is responding over HTTPS with HTTP 200 from this runner."
              exit 0
            fi

            echo "External probe returned HTTP ${code:-curl-error}; retry ${attempt}/2."
            sleep 5
          done

          echo '--- response headers ---' >&2
          sed -n '1,80p' "$headers" >&2
          if grep -qi '^cf-mitigated: challenge' "$headers"; then
            echo '::warning::Cloudflare challenged the GitHub-hosted cloud runner. This probe is advisory because cloud-provider IP reputation is not representative of the real client network.' >&2
          else
            echo '::warning::External probe did not return HTTP 200. Review the response headers; deployment itself already completed.' >&2
          fi
          exit 1

      - name: Summarize advisory probe
        if: steps.probe.outcome == 'failure'
        run: |
          echo 'Cloudflare control-plane deployment succeeded, but the GitHub-hosted external probe was challenged or otherwise non-200.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use a no-cookie curl from the actual client network as the authoritative reachability check.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const probe = '${{ steps.probe.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'cloudflare/production',
              description: success
                ? (probe === 'success'
                    ? 'edge.tianbufu.click deployed and externally verified'
                    : 'edge.tianbufu.click deployed; cloud probe challenged')
                : 'Cloudflare production deployment failed'
            });
