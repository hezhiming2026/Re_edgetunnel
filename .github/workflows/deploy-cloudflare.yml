name: Validate and Deploy Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check

  deploy:
    name: Deploy edge.tianbufu.click
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-cloudflare-production
      cancel-in-progress: false

    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'cloudflare/production',
              description: 'Deploying edge.tianbufu.click'
            });

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Provision production KV and prepare Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_TITLE: tianbufu-edge-production
        run: bash scripts/prepare-cloudflare-config.sh

      - name: Deploy Worker and upload runtime secrets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.deploy.toml
          secrets: |
            ADMIN
            UUID
        env:
          ADMIN: ${{ secrets.EDGETUNNEL_ADMIN }}
          UUID: ${{ secrets.EDGETUNNEL_UUID }}

      - name: Verify custom domain
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 15 https://edge.tianbufu.click/ >/dev/null; then
              echo "edge.tianbufu.click is responding over HTTPS."
              exit 0
            fi
            echo "Custom domain is not ready yet; retry ${attempt}/18."
            sleep 10
          done
          echo "Deployment completed, but the custom domain did not become reachable during the verification window." >&2
          exit 1

      - name: Publish deployment result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'cloudflare/production',
              description: state === 'success'
                ? 'edge.tianbufu.click deployed and verified'
                : 'Cloudflare production deployment failed'
            });
