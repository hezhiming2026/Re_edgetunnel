name = "tianbufu-edge"
main = "src/index.js"
compatibility_date = "2026-08-06"
workers_dev = false

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 0.01

[[routes]]
pattern = "edge.tianbufu.click"
custom_domain = true

[vars]
HOST = "edge.tianbufu.click"
TCP_CONCURRENT_DIAL = "1"
PROXY_CONCURRENT_DIAL = "1"
SPEEDTEST_MODE = "local"
SPEEDTEST_DOMAINS = "speed.cloudflare.com,cp.cloudflare.com"
OPTIMIZER_ALLOWED_CIDRS = "103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,104.16.0.0/13,104.24.0.0/14,108.162.192.0/18,131.0.72.0/22,141.101.64.0/18,162.158.0.0/15,172.64.0.0/13,173.245.48.0/20,188.114.96.0/20,190.93.240.0/20,197.234.240.0/22,198.41.128.0/17"
FALLBACK_DOMAINS = ""
FORCE_EGRESS_DOMAINS = ""
EGRESS_FIRST_BYTE_TIMEOUT_MS = "8000"

# ADMIN, UUID, OPTIMIZER_TOKEN, and DIAGNOSTIC_TARGETS are Worker secrets.
# Keep real diagnostic target hostnames outside committed configuration.

[[durable_objects.bindings]]
name = "OPTIMIZER_COORDINATOR"
class_name = "OptimizerCoordinator"

[exports.OptimizerCoordinator]
type = "durable-object"
storage = "sqlite"

[[kv_namespaces]]
binding = "KV"
id = "your-kv-id-here"
