name = "tianbufu-edge"
main = "src/index.js"
compatibility_date = "2026-08-06"
workers_dev = false

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 0.01

[[routes]]
pattern = "edge.tianbufu.click"
custom_domain = true

[vars]
HOST = "edge.tianbufu.click"
TCP_CONCURRENT_DIAL = "1"
PROXY_CONCURRENT_DIAL = "1"
SPEEDTEST_MODE = "local"
SPEEDTEST_DOMAINS = "speed.cloudflare.com,cp.cloudflare.com"

# ADMIN and UUID are Worker secrets. Never store them in this file.
# The deployment workflow uploads them from GitHub Actions secrets.

[[kv_namespaces]]
binding = "KV"
id = "your-kv-id-here"
